<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#FFF8F0" />
  <title>Family Hub</title>
  <link rel="stylesheet" href="./styles.css" />
  <!-- VK Bridge (грузится из CDN; при отсутствии приложение работает автономно) -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="logo"><span class="badge">🏡</span> Family&nbsp;Hub</div>
      <div class="spacer"></div>
      <button class="iconbtn" id="soundBtn" title="Звук">🔈</button>
      <button class="iconbtn" id="themeBtn" title="Тема">🌙</button>
      <div class="me-chip" id="meChip" title="Сменить участника">
        <span class="av" id="meAv">👨</span>
        <span class="hp"><span id="meHearts">0</span>♥</span>
      </div>
    </div>

    <div class="screen" id="screen"></div>

    <nav class="nav" id="nav"></nav>
  </div>

  <!-- Онбординг -->
  <div class="onb" id="onb" hidden></div>

  <!-- Модалка / тост / эффекты -->
  <div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
  <div class="goldflash" id="goldflash"></div>

  <!-- Порядок важен: сначала данные и эффекты, затем рендер, VK и запуск -->
  <script src="./src/state.js"></script>
  <script src="./src/effects.js"></script>
  <script src="./src/render.js"></script>
  <script src="./src/vk.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
